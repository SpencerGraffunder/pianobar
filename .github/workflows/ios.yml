#
# iOS CI — build the pianobar iOS app (ios/) and produce an .ipa.
#
# Steps:
#   1. Generate the Xcode project from ios/project.yml (xcodegen).
#   2. Run the unit tests on an iOS simulator.
#   3. Build a Release archive for a generic iOS device (code signing
#      disabled — no Apple credentials needed).
#   4. Assemble the .app into a (unsigned) .ipa and publish it as a
#      GitHub RELEASE asset — downloads are a bare .ipa file (Actions
#      artifacts are always wrapped in a .zip). An unsigned .ipa can be
#      installed with any re-signing tool (Sideloadly, AltStore,
#      TrollStore, ...) or with your own ad-hoc profile.
#
# To produce a *signed* .ipa instead, add the usual Apple secrets
# (certificates / provisioning profile) and swap the export step for
# `xcodebuild -exportArchive` with a matching ExportOptions.plist.
#
name: ios

on:
  push:
    branches: [ master ]
    paths:
      - 'ios/**'
      - 'src/libpiano/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'src/libpiano/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# Needed to publish the .ipa as a release asset (rolling 'ios-latest').
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphonesimulator|iphoneos'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Run unit tests (iOS simulator)
        working-directory: ios
        run: |
          # xcodebuild test needs a *concrete* simulator; pick the first
          # available iPhone on this runner rather than hard-coding a name.
          SIM=$(xcrun simctl list devices available --json \
                | jq -r '.devices[] | .[] | select(.name | contains("iPhone")) | .name' \
                | head -1)
          echo "Using simulator: $SIM"
          xcodebuild -project Piano.xcodeproj -scheme PianoApp \
            -destination "platform=iOS Simulator,name=$SIM" \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            test

      - name: Build Release for iOS device
        run: |
          xcodebuild -project ios/Piano.xcodeproj -scheme PianoApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="-" \
            build

      - name: Assemble .ipa
        run: |
          APP=$(find dd-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Bundling $APP"
          mkdir -p ipa-staging/Payload
          cp -R "$APP" ipa-staging/Payload/
          cd ipa-staging
          zip -qry ../pianobar-ios.ipa Payload
          cd ..
          ls -lh pianobar-ios.ipa

      - name: Publish .ipa as GitHub Release (bare file, no zip)
        # PR runs (esp. from forks) get a read-only token; publish only on push/dispatch.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rolling release: always holds the newest CI build. Release
          # assets download as the bare .ipa (Actions artifacts are always
          # zipped, which is why we don't use them for the .ipa).
          TAG=ios-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pianobar-ios.ipa --clobber
          else
            gh release create "$TAG" pianobar-ios.ipa \
              --title "iOS build (latest CI)" \
              --notes "Unsigned .ipa from CI. Re-sign with Sideloadly / AltStore / an ad-hoc profile to install."
          fi
          gh release view "$TAG"
